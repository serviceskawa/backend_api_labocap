# Supervision interne : Prometheus (90 jours) + Grafana, sur le même réseau
# Compose que l'API. À lancer EN PLUS du fichier principal :
#
#   docker compose -f docker-compose.yml -f docker-compose.supervision.yml up -d
#
# avec MANAGEMENT_METRICS_EXPOSED=true dans .env, sans quoi l'API répond 404
# à Prometheus. Les deux interfaces n'écoutent que sur la boucle locale de
# l'hôte : on y accède par un tunnel SSH (ssh -L 3000:localhost:3000 …), pas
# par nginx. Requêtes utiles : docs/supervision.md.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: labo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=90d"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: labo-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Mot de passe initial, à changer à la première connexion.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changez-moi}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  prometheus-data:
  grafana-data:
