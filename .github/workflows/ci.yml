name: Tests

# Même rôle que `tests.yml` chez fluidpay-bulk-payment : la suite tourne sur
# chaque PR vers develop ou main. deploy.yml l'appelle aussi (workflow_call) pour qu'un
# commit qui casse un test ne parte jamais en production (SPEC Lot 9).
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    # 45 classes d'intégration démarrent chacune leur PostgreSQL (Testcontainers)
    # et un contexte Spring : compter une vingtaine de minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Deux branches qui prennent le même numéro passent chacune leurs tests
      # (Flyway est éteint dans la suite) ; Flyway refuse ensuite de démarrer
      # en production (V100 en double, 03/10). La PR teste le résultat fusionné.
      - name: Numéros de migration uniques
        run: |
          d=$(ls src/main/resources/db/migration | sed -n 's/^V\([0-9.]*\)__.*/\1/p' | sort | uniq -d)
          [ -z "$d" ] || { echo "::error::Version(s) de migration en double : $d"; exit 1; }

      # Testcontainers trouve seul le démon Docker du runner GitHub : pas de
      # service `postgres` à déclarer, contrairement aux projets Laravel.
      - name: Compiler et tester
        run: mvn -B --no-transfer-progress verify

  # L'image livrée démarre-t-elle ? La suite teste le classpath de test, pas le
  # jar : un 03/10, tests verts et production qui refuse de démarrer.
  demarrage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image (Dockerfile de production)
        run: docker build -t labo-anapath-api:ci .
      - name: Démarrer en profil prod
        run: scripts/demarrage-ci.sh labo-anapath-api:ci

  # Dépendances connues vulnérables (lot 4). Demande la clé NVD en secret
  # (NVD_API_KEY, gratuite sur nvd.nist.gov/developers/request-an-api-key) :
  # sans elle, le téléchargement de la base prend des heures. Le job échoue
  # au-delà de CVSS 7, sauf suppression justifiée dans
  # dependency-check-suppressions.xml.
  dependances:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Base NVD en cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning::Secret NVD_API_KEY absent : analyse des dépendances non exécutée."
            exit 0
          fi
          mvn -B --no-transfer-progress -DskipTests dependency-check:check
