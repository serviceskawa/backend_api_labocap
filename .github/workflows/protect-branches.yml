name: Protect Branches

# Repris de fluidpay-main, avec sa règle « seul develop merge vers main » :
# les branches feat/… ou fix/… rejoignent develop par PR, develop rejoint main.
# Ce workflow signale ; le vrai verrou est la protection de branche GitHub
# (Settings → Branches → main : PR obligatoire, check `Tests / tests` requis).
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

jobs:
  check-direct-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que le push vient d'une PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR" ]; then
            echo "::error::Push direct sur main sans PR !"
            exit 1
          fi
          echo "Push via PR #$PR"

  check-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier l'origine de la PR
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ]; then
            if [ "$BRANCH" != "develop" ] && ! echo "$BRANCH" | grep -qE "^hotfix/"; then
              echo "::error::Seule develop (ou un hotfix/) peut être fusionnée dans main. Ouvrir la PR vers develop."
              exit 1
            fi
          elif ! echo "$BRANCH" | grep -qE "^(feat|fix|chore|hotfix|docs|refactor)/"; then
            echo "::error::Nom de branche '$BRANCH' invalide. Préfixes : feat/ fix/ chore/ hotfix/ docs/ refactor/"
            exit 1
          fi
          echo "PR '$BRANCH' → '$BASE' : OK"
