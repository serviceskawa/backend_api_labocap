name: Deploy Spring Boot Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Déploiement Docker : le serveur récupère les sources et reconstruit
      # l'image via docker-compose (le Dockerfile compile lui-même le jar).
      - name: Déploiement (git pull + docker compose rebuild)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m        # le rebuild Maven dans Docker peut durer plusieurs minutes
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            echo "→ Récupération du code (main)"
            git fetch --prune origin main
            git reset --hard origin/main

            echo "→ Reconstruction de l'image API + redémarrage"
            docker compose up -d --build api

            echo "→ Vérification que le conteneur tourne"
            sleep 20
            if [ "$(docker inspect -f '{{.State.Status}}' labo-api)" != "running" ]; then
              echo "Conteneur non démarré — logs :"
              docker compose logs --tail=80 api
              exit 1
            fi
            echo "Déploiement OK (labo-api démarré)"
