# ── Relais de voix (coturn) ────────────────────────────────────────────────
#
# À quoi il sert : les abonnés mobiles sont derrière un NAT d'opérateur, donc
# deux téléphones ne peuvent pas s'adresser directement. Le relais leur donne un
# point de rendez-vous public. Sans lui, une part des appels échoue — et de façon
# apparemment aléatoire, ce qui est le pire des symptômes à diagnostiquer.
#
# Ce qu'il ne voit pas : la voix. WebRTC la chiffre de bout en bout (DTLS-SRTP)
# avant qu'elle n'arrive ici. Le relais déplace des paquets qu'il ne peut pas
# lire.

# ── L'interface publique, et elle seule ────────────────────────────────────
#
# À remplacer par l'adresse publique du serveur.
#
# Sans ces deux lignes, coturn écoute sur toutes les interfaces — y compris les
# ponts Docker des autres projets hébergés — et annonce chacune aux téléphones
# comme point de rendez-vous possible. L'appel finit par s'établir, mais après
# plusieurs secondes passées à essayer des adresses 172.x injoignables depuis
# Internet. À chaque appel.
#
# Les épingler ferme aussi le relais aux conteneurs voisins, qui n'ont aucune
# raison d'y accéder.
listening-ip=REMPLACER_PAR_L_IP_PUBLIQUE
relay-ip=REMPLACER_PAR_L_IP_PUBLIQUE

listening-port=3478
fingerprint

# ── L'adresse annoncée aux téléphones ──────────────────────────────────────
#
# coturn dit aux appareils « rappelez-moi à cette adresse ». S'il annonce une
# adresse privée, l'appel s'établit puis reste muet — des deux côtés, sans
# message d'erreur. C'est le symptôme le plus long à diagnostiquer de tout ce
# dispositif, et il ne se voit qu'en production.
#
# Le vérifier une fois, sur le serveur :
#     ip -4 addr show | grep "inet "     → l'adresse portée par la carte
#     curl -s ifconfig.me                → l'adresse vue de l'extérieur
#
# Si elles sont identiques, il n'y a rien à faire. Si elles diffèrent — certains
# hébergeurs traduisent —, décommenter la ligne suivante au format
# PUBLIQUE/PRIVÉE :
# external-ip=203.0.113.10/10.0.0.5


# Identifiants dérivés d'un secret partagé, valables quelques heures.
#
# Un compte fixe suppose un mot de passe embarqué dans l'APK — donc lisible par
# quiconque la décompile, et bon pour toujours. Ici l'application demande au
# serveur un couple qui expire tout seul.
use-auth-secret
static-auth-secret=REMPLACER_PAR_LE_SECRET
realm=anapathlab.bj

# Sans cela, coturn accepte de relayer vers n'importe où — y compris vers le
# réseau interne du serveur. Un relais ouvert devient un point de rebond pour
# scanner ce qui n'est pas exposé, et finit sur les listes noires.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Un appel audio à quatre consomme environ 200 kbit/s par participant. La borne
# protège d'un appareil qui s'emballerait, pas d'un usage normal.
user-quota=12
total-quota=100
max-bps=256000

# Les anciens protocoles ne servent qu'à se faire recenser par les scanneurs.
no-tlsv1
no-tlsv1_1
no-cli

# La plage de ports que coturn attribue aux relais. Elle doit être ouverte en UDP
# sur le pare-feu, sinon le relais accepte l'appel puis reste muet.
min-port=49160
max-port=49200
