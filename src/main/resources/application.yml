spring:
  application:
    name: labo-anapath-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labo_anapath}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Base restaurée depuis un dump déjà migré jusqu'à V50 : on baseline à V50
    # pour que Flyway ne rejoue pas V2..V50 (sinon clés dupliquées). Les V51+ s'appliqueront.
    baseline-version: 50
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    time-zone: Africa/Porto-Novo
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  # Derrière le reverse proxy nginx (api.caap.bj) : reconstruire le schéma et
  # l'IP d'origine depuis X-Forwarded-* — indispensable pour les cookies Secure
  # et les redirections en https.
  forward-headers-strategy: framework

app:
  report:
    notify-retry:
      # Reprise des avis de disponibilité qu'un compte-rendu validé hors de la
      # plage d'appel 8h–18h n'a pas pu déclencher. Tous les jours à 8h, heure du
      # laboratoire. « - » désactive la tâche ; un cron plus court sert la recette.
      cron: ${REPORT_NOTIFY_RETRY_CRON:0 0 8 * * *}
  # Adresse publique de l'API, telle qu'un client la voit depuis son téléphone.
  # Sert à construire le lien de téléchargement envoyé par SMS : il doit être
  # joignable depuis l'extérieur, pas seulement depuis le réseau du laboratoire.
  public-base-url: ${PUBLIC_BASE_URL:https://api.caap.bj}
  invoice:
    share-link:
      # Durée de vie du lien public de facture. Un SMS reste indéfiniment dans le
      # téléphone de son destinataire : sans expiration, le lien deviendrait un
      # accès permanent à une pièce comptable.
      ttl-days: ${INVOICE_SHARE_LINK_TTL_DAYS:60}
  jwt:
    secret: ${JWT_SECRET}
    # Une session web s'éteint après 15 minutes sans activité.
    #
    # Ce n'est pas ce jeton-là qui tenait la session : le front rafraîchit tout
    # seul sur 401, et le jeton de rafraîchissement vivait sept jours. Un poste
    # laissé ouvert au comptoir restait donc utilisable une semaine.
    #
    # Le jeton d'accès est délibérément bien plus court que la fenêtre : c'est
    # son expiration qui déclenche le rafraîchissement, donc qui fait glisser la
    # fenêtre sur l'activité réelle. Cinq minutes laissent trois occasions de la
    # prolonger avant les quinze.
    expiration-ms: ${JWT_EXPIRATION:300000}
    # La fenêtre elle-même. Le rafraîchissement fait tourner le jeton et
    # blackliste l'ancien : chaque appel repart pour quinze minutes, et quinze
    # minutes sans le moindre appel ferment la session côté serveur — quoi que
    # fasse le navigateur.
    refresh-expiration-ms: ${JWT_REFRESH:900000}
  storage:
    path: ${STORAGE_PATH:/tmp/labo/storage}
    encryption:
      # Chiffrement des fichiers stockés. Faux par défaut : tant qu'il l'est, le
      # composant n'existe même pas et rien ne change sur le disque.
      enabled: ${STORAGE_ENCRYPTION_ENABLED:false}
      # Clé maîtresse, 32 octets en base64 — « openssl rand -base64 32 ».
      # Une clé perdue rend les fichiers chiffrés DÉFINITIVEMENT illisibles :
      # en garder une copie hors du serveur. Vide par défaut, mais le démarrage
      # échoue si le chiffrement est activé sans elle — mieux vaut un refus au
      # démarrage qu'une erreur sur chaque image, découverte par les utilisateurs.
      key: ${STORAGE_ENCRYPTION_KEY:}
    # ── Stockage sur S3 ──────────────────────────────────────────────────
    #
    # Désactivé par défaut : sans seau configuré, les fichiers restent sur le
    # disque du serveur et rien ne change.
    #
    # Quand il est actif : on ÉCRIT dans le seau, et on LIT d'abord dans le
    # seau puis sur le disque. Ce repli rend les clichés d'avant la bascule
    # lisibles sans migration en bloc — et permet de revenir en arrière en
    # retirant une seule ligne.
    #
    # Ce qu'AWS reçoit : des octets DÉJÀ CHIFFRÉS par le serveur. Le seau ne
    # contient aucune lame lisible. Corollaire à connaître : on ne peut pas
    # servir ces objets par lien signé au navigateur, qui ne saurait pas les
    # déchiffrer — les images continuent de passer par l'API.
    s3:
      enabled: ${S3_ENABLED:false}
      bucket: ${S3_BUCKET:}
      region: ${S3_REGION:eu-west-3}
      # Un dossier de tête dans le seau, si on le partage avec autre chose.
      prefix: ${S3_PREFIX:}
      # Vides, la chaîne d'AWS prend le relais : rôle IAM de la machine,
      # variables d'environnement, ~/.aws. C'est ce qu'il faut sur une
      # instance EC2, où poser une clé en dur serait un recul.
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      # Pour viser MinIO ou un service compatible plutôt qu'AWS.
      endpoint: ${S3_ENDPOINT:}
  secrets:
    # Clé des secrets courts qu'il faut pouvoir remontrer — aujourd'hui le seul
    # code d'enrôlement mobile, dont le QR se réaffiche à chaque consultation.
    # 32 octets en base64, « openssl rand -base64 32 ».
    #
    # Vide, la fonction s'éteint sans bruit : le code n'est plus conservé de
    # relisible et l'écran redit simplement qu'il n'y a rien à réafficher. Un
    # refus au démarrage punirait les installations qui n'en ont jamais voulu.
    #
    # À défaut, la clé du chiffrement des fichiers ci-dessus est employée : une
    # seule clé à garder pour qui en a déjà posé une. Changer la clé rend les
    # codes existants non réaffichables — ils continuent d'enrôler.
    key: ${SECRETS_KEY:}
  appels:
    # Le relais de voix (coturn). Sans lui, les appels échouent pour tous les
    # abonnés derrière un NAT d'opérateur — c'est-à-dire la majorité sur données
    # mobiles. L'application est prévenue par « relaisConfigure » et le dit,
    # plutôt que de laisser l'appel échouer sans explication.
    turn-url: ${TURN_URL:}
    # Le secret partagé avec coturn (« use-auth-secret »). Le serveur en dérive
    # des identifiants qui expirent : un mot de passe fixe embarqué dans l'APK
    # ouvrirait le relais à qui le décompile.
    turn-secret: ${TURN_SECRET:}
    turn-ttl-secondes: ${TURN_TTL:86400}
    stun-url: ${STUN_URL:stun:stun.l.google.com:19302}
  push:
    # Notifications hors-app (Firebase Cloud Messaging). Clé du compte de
    # service du projet Firebase, au choix par son contenu ou par son chemin.
    #
    # Vide, la fonction s'éteint sans bruit : l'application continue de marquer
    # les non-lus, seule l'alerte quand elle est fermée manque. Un refus au
    # démarrage punirait les installations qui n'ont pas de projet Firebase — et
    # il n'y a rien d'irréversible à perdre ici, contrairement à la clé de
    # chiffrement des fichiers, qu'on ne peut pas régénérer.
    #
    # Le contenu, pour qui passe ses secrets par l'environnement :
    credentials: ${PUSH_CREDENTIALS:}
    # ou le chemin d'un fichier monté, pour qui préfère un volume :
    credentials-file: ${PUSH_CREDENTIALS_FILE:}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:Labo AnaPath}
  fluidpay:
    sms:
      # Passerelle SMS FluidPay (app.fluidpay.link), qui achemine via l'opérateur
      # désigné ci-dessous. Distincte de app.fluidinvoice, qui est la passerelle
      # fiscale : deux produits, deux domaines, deux clés.
      #
      # Activée par défaut, mais sans effet tant que la clé manque : les SMS
      # repartent alors par l'API OurVoice directe, comme avant la bascule.
      enabled: ${FLUIDPAY_SMS_ENABLED:true}
      base-url: ${FLUIDPAY_SMS_BASE_URL:https://app.fluidpay.link}
      # Jamais en dur : la clé autorise des envois facturés.
      api-key: ${FLUIDPAY_SMS_API_KEY:}
      # Clé de chiffrement, 32 caractères. Obligatoire : le serveur refuse une
      # requête SMS non chiffrée (missing_encrypted_data), quoi qu'en dise
      # docs/openapi.yaml, qui décrit l'endpoint comme prenant du clair.
      encryption-key: ${FLUIDPAY_SMS_ENCRYPTION_KEY:}
      # Opérateur d'acheminement : ourvoice | lafricamobile.
      provider: ${FLUIDPAY_SMS_PROVIDER:lafricamobile}
      # Expéditeur affiché sur le téléphone, 11 caractères au plus. Vide = celui
      # déclaré au compte de l'opérateur, le seul enregistré auprès de lui.
      sender: ${FLUIDPAY_SMS_SENDER:}
  fluidinvoice:
    # Passerelle de facturation normalisée e-MCF / DGI (invoice.fluidpay.link).
    # Désactivée par défaut : sans clé, aucune facture ne doit partir à la DGI.
    enabled: ${FLUIDINVOICE_ENABLED:false}
    base-url: ${FLUIDINVOICE_BASE_URL:https://invoice.fluidpay.link/v1}
    # Jamais en dur : la clé vaut signature fiscale. Préfixe fni_test_ / fni_live_.
    api-key: ${FLUIDINVOICE_API_KEY:}
    operator-name: ${FLUIDINVOICE_OPERATOR_NAME:CENTRE ADECHINA ANATOMIE PATHOLOGIQUE}
    # A = exonéré. La classification fiscale engage le contribuable (Art. 168 CGI).
    tax-group: ${FLUIDINVOICE_TAX_GROUP:A}
  alerts:
    report:
      days: ${ALERT_REPORT_DAYS:18}
      max-per-run: ${ALERT_REPORT_MAX:200}
  support:
    ticket-notify-email: ${TICKET_NOTIFY_EMAIL:serviceskawa@gmail.com}

logging:
  file:
    # Journal sur disque, en plus de la console. Sans lui, les traces meurent
    # avec le terminal : un envoi de SMS refusé la nuit ne laisse rien à lire
    # le lendemain.
    #
    # Chemin relatif au répertoire de lancement en développement ; en
    # production, viser un volume qui survit au conteneur (LOG_FILE).
    name: ${LOG_FILE:logs/labo-api.log}
  logback:
    rollingpolicy:
      # Un fichier par jour, et un nouveau dès 10 Mo : un journal d'un seul
      # tenant devient illisible et finit par remplir le disque.
      file-name-pattern: ${LOG_FILE:logs/labo-api.log}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      # Un mois d'historique : de quoi remonter à un incident signalé tard,
      # sans garder indéfiniment des journaux qui nomment des patients.
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # L'indicateur mail ouvre une connexion SMTP réelle à chaque sonde : sans
      # identifiants valides il met tout /actuator/health à DOWN et le
      # healthcheck Docker déclare le conteneur unhealthy alors que l'API sert.
      # L'échec d'envoi d'un e-mail reste géré côté applicatif.
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
