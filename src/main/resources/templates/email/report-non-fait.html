<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="500" cellpadding="0" cellspacing="0"
                       style="max-width:500px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">
                    <tr>
                        <td style="background-color:#1a5276; padding:18px 24px; text-align:center;">
                            <span style="color:#ffffff; font-size:18px; font-weight:bold;"
                                  th:text="${labName}">Laboratoire</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px;">
                            <p style="font-size:15px; color:#333333; margin:0 0 16px;">
                                Bonjour <span th:text="${doctorName}">Docteur</span>,
                            </p>
                            <p style="font-size:15px; color:#333333; margin:0 0 16px; line-height:1.5;">
                                Le compte rendu pour la demande
                                <strong th:text="'[' + ${testOrderCode} + ']'">[CODE]</strong>
                                est en attente depuis
                                <strong><span th:text="${days}">18</span> jours</strong>.
                            </p>
                            <p style="font-size:15px; color:#333333; margin:24px 0 0;">
                                Cordialement,<br/>
                                La direction <span th:text="${labName}">Laboratoire</span>
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color:#f0f0f0; padding:12px 24px; text-align:center;">
                            <span style="font-size:11px; color:#999999;">
                                Cet email a été généré automatiquement, merci de ne pas y répondre.
                            </span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
