<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title th:text="${code}">Compte rendu</title>
    <style>
        /* Marges calées sur le compte rendu Laravel de référence (CO26-2568) :
           ~22pt à gauche/droite et ~36pt sous le pied de page. La marge basse
           doit loger le pied de page complet (3 lignes) PLUS cet espace : trop
           courte, le texte débordait jusqu'au bord de la feuille. */
        @page {
            size: A4;
            margin: 15px 30px 115px 30px;
            @bottom-center { content: element(pagefooter); }
        }
        /*
           Interligne aligné sur le legacy, par la mesure et non par le calcul.

           Le gabarit Laravel ne déclarait aucun line-height. On aurait pu croire
           que DomPDF appliquait son `font_height_ratio` (1.1 dans
           config/dompdf.php) comme multiplicateur : c'est faux, ce réglage
           pondère les métriques de la police. Un document rendu par DomPDF
           lui-même, avec la configuration du projet legacy, donne 12,0 pt
           d'interligne pour un corps de 9,75 pt — soit 1,23.

           Le corps, lui, était déjà conforme : Arial (que les deux moteurs
           résolvent en Helvetica, police de base du format PDF), 13 px à
           96 DPI — 9,75 pt d'un côté, 9,8 de l'autre.
        */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; line-height: 1.23; }
        .entete img { width: 100%; }
        table.meta-row { width: 100%; border-collapse: collapse; margin-top: 22px; }
        table.meta-row td { vertical-align: top; padding: 0; }
        /* Interligne : hérité du corps, le legacy ne distinguant pas ce bloc.
           Le 1.6 qui figurait ici l'étirait d'un tiers.

           `margin-left` : le legacy pose 10 px sur ce bloc précis
           (canva_caap.blade.php, div du bloc d'en-tête). Mesuré, le texte y
           commence à 30,3 pt du bord contre 22,5 sans lui. */
        .meta { font-size: 13px; margin-left: 10px; }
        .qr-cell { text-align: right; width: 90px; }
        .qr-cell img { width: 80px; display: inline-block; vertical-align: top; }
        .title-band {
            background-color: #0070C1;
            width: 96%;
            padding: 15px;
            color: white;
            text-align: center;
            font-size: 16px;
            text-transform: uppercase;
            margin-top: 20px;
        }
        .section-label {
            display: inline-block;
            padding-left: 10px;
            padding-right: 5px;
            margin-top: 15px;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: bold;
        }
        table.infos { width: 100%; margin-left: 15px; font-size: 13px; margin-top: 5px; border-collapse: collapse; }
        table.infos th { text-align: left; width: 25%; font-weight: bold; }
        table.infos td { width: 25%; }
        hr.sep { margin-top: 15px; border: none; border-top: 1px solid #0070C1; }
        .content { font-size: 13px; }
        /* Le bloc de signature ne se coupe pas.
           Mesuré dans le PDF produit : sans cette règle, un compte rendu dont le
           texte s'arrête près du bas de page laissait « Signé électroniquement
           par : » sur une feuille et le nom du signataire sur la suivante. Une
           mention d'attribution séparée de la personne qu'elle désigne n'a pas
           sa place sur un document médical.

           La marge haute est ramenée de 40 à 24 px pour la même raison. Le
           moteur la compte pour décider si le bloc tient, puis l'abandonne en
           tête de page suivante — vérifié : la signature repartie y est tracée
           dès le haut du cadre. Ces points ne servaient donc qu'à provoquer le
           renvoi qu'ils ne compensaient pas. */
        table.sign { width: 100%; margin-top: 24px; page-break-inside: avoid; }
        table.sign td { vertical-align: bottom; font-size: 13px; width: 50%; text-align: left; }
        .sign-name { font-weight: bold; }
        .sign-space { min-height: 45px; }
        /* La signature tient dans l'espace qui lui est réservé.
           Le gabarit ne posait qu'une largeur : la hauteur suivait le rapport
           d'aspect du fichier de chaque médecin. Mesuré dans le PDF produit, une
           signature carrée sortait à 63,8 pt de haut pour 33,75 réservés — elle
           gonflait le bloc de trente points et le faisait basculer en page
           suivante là où une signature en bandeau tenait. La pagination du
           compte rendu dépendait donc du fichier téléversé, ce que rien
           n'indiquait. Le plafond la rend identique pour tous les signataires. */
        .sign-space img { max-width: 85px; max-height: 45px; }
        /* La signature tient dans l'espace qui lui est réservé.
           Le gabarit ne posait qu'une largeur : la hauteur suivait le rapport
           d'aspect du fichier téléversé par chaque médecin, si bien que la
           pagination du compte rendu dépendait de la forme de sa signature. Une
           signature carrée gonflait le bloc de 64 pt et le faisait basculer en
           page suivante là où une signature en bandeau tenait. Le plafond rend
           la hauteur du bloc identique pour tous les signataires. */
        /* Pied de page : placé dans la marge basse de CHAQUE page (position: running). */
        .page-footer {
            position: running(pagefooter);
            width: 100%;
            font-size: 12px;
            text-align: center;
            border-top: 1px solid #cccccc;
            padding-top: 6px;
            /* Décolle le pied de page du bord bas de la feuille. Le pied étant
               centré dans la boîte de marge, cette valeur ne compte qu'à moitié. */
            margin-bottom: 30px;
        }
    </style>
</head>

<body>

    <!-- Entête labo en pleine largeur -->
    <div class="entete" th:if="${!#strings.isEmpty(enteteImg)}">
        <img th:src="${enteteImg}" alt=""/>
    </div>

    <!-- N° ANAPATH + dates (gauche) et QR (droite) sur la même ligne -->
    <table class="meta-row">
        <tr>
            <td>
                <div class="meta">
                    <b>N° ANAPTH :</b> <span th:text="${testOrderCode}"></span>
                    <b th:text="${#strings.isEmpty(testAffiliate) ? '' : '| Examen reference : '}"></b>
                    <span th:text="${#strings.isEmpty(testAffiliate) ? '' : testAffiliate}"></span>
                    <br/>
                    <b>Date validation:</b> <span th:text="${signatureDate}"></span>
                    <br/>
                    <b>Date impression:</b> <span th:text="${currentDate}"></span>
                </div>
            </td>
            <td class="qr-cell">
                <img th:if="${!#strings.isEmpty(qrcode)}" th:src="${qrcode}" alt=""/>
            </td>
        </tr>
    </table>

    <!-- Bandeau titre -->
    <div class="title-band">
        <b th:text="${title}"></b>
    </div>

    <!-- Informations prélèvement -->
    <div style="margin-top: 10px;">
        <span class="section-label">Informations prélèvement</span>

        <table class="infos">
            <tbody>
                <tr>
                    <th>Nom :</th>
                    <td th:text="${patientFirstname}"></td>
                    <th>Date prélèvement :</th>
                    <td th:text="${prelevementDate}"></td>
                </tr>
                <tr>
                    <th>Prénoms :</th>
                    <td th:text="${patientLastname}"></td>
                    <th>Date d’arrivée labo :</th>
                    <td th:text="${createdAt}"></td>
                </tr>
                <tr>
                    <th>Age :</th>
                    <td th:text="${patientAge + ' ' + patientAgeUnit}"></td>
                    <th>Service demandeur :</th>
                    <td th:text="${hospitalName}"></td>
                </tr>
                <tr>
                    <th>Sexe :</th>
                    <td th:text="${patientGenre}"></td>
                    <th>Médecin prescripteur :</th>
                    <td th:text="${doctorName}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <hr class="sep"/>

    <!-- Contenu (HTML brut : macro / micro / compléments) -->
    <span class="content" th:utext="${content}"></span>
    <span class="content" th:utext="${contentMicro}"></span>
    <th:block th:if="${!#strings.isEmpty(contentSupplementaire)}">
        <span class="content" th:utext="${contentSupplementaire}"></span>
        <span class="content" th:utext="${contentSupplementaireMicro}"></span>
    </th:block>

    <!-- Signatures (uniquement si compte rendu validé) — réplique canva_caap :
         gauche = signataire (signature manuscrite + nom),
         droite = titre de revue (« Signé électroniquement par : ») + relecteur. -->
    <div th:if="${status == 1}">
        <table class="sign">
            <tr>
                <td>
                    <th:block th:if="${!#strings.isEmpty(signator)}">
                        <div class="sign-space">
                            <img th:if="${!#strings.isEmpty(signature1Img)}" th:src="${signature1Img}" alt=""/>
                        </div>
                        <span th:text="${signator}"></span>
                    </th:block>
                </td>
                <td>
                    <th:block th:if="${!#strings.isEmpty(reviewedBy)}">
                        <span th:text="${reportReviewTitle}"></span><br/>
                        <span class="sign-name" th:text="${reviewedBy}"></span>
                    </th:block>
                </td>
            </tr>
        </table>
    </div>

    <!-- Pied de page (rendu en bas de chaque page via position: running) -->
    <div class="page-footer" th:text="${footer}"></div>

</body>

</html>
